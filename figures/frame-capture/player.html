	<figure class="mf" id="frame-capture" data-mf-figure="frame-capture" aria-labelledby="fc-title">
		<p class="sr-only" id="fc-title" data-ed="page.srTitle"></p>
		<div class="mf-shot" data-mf-shot>
			<div class="mf-stage">
				<svg viewBox="0 0 960 540" aria-hidden="true" focusable="false"></svg>
			</div>
			<div class="fc-narrow" data-fc-narrow aria-hidden="true"></div>
			<div class="mf-caption" data-mf-caption aria-hidden="true"></div>
		</div>
		<div class="mf-controls">
			<button class="mf-toggle" type="button" data-mf-toggle><span class="mf-icon" aria-hidden="true"></span><span data-mf-label>Play</span><span class="sr-only"> the frame capture figure</span></button>
			<button class="mf-btn" type="button" data-mf-replay><span class="mf-restart-icon" aria-hidden="true"></span>Restart</button>
			<input class="mf-scrub" type="range" data-mf-scrub aria-label="Scrub through the figure" value="0">
			<span class="mf-time" data-mf-time aria-hidden="true">0:00 / 1:30</span>
		</div>
		<p class="fc-source" data-fc-source hidden></p>
		<!-- High school: a note for teachers, just under the player and its source line (empty, so hidden, in the other casts). -->
		<aside class="fc-teacher" aria-label="For teachers"><p class="fc-teacher-label">For teachers</p><p class="fc-teacher-text" data-ed-rich="page.teacherNote"></p></aside>
		<figcaption>
			<p class="sr-only" data-ed="page.srSummary"></p>
			<ol class="mf-beats is-list" data-mf-beats aria-label="Beats"></ol>
		</figcaption>
	</figure>
