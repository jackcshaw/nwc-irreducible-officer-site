<figure class="mf" data-mf-figure="invisible-delegation" id="invisible-delegation" aria-labelledby="id-title">
		<p class="sr-only" id="id-title" data-ed="page.srTitle"></p>
		<div class="mf-shot" data-mf-shot>
			<div class="mf-stage">
				<svg viewBox="0 0 960 540" aria-hidden="true" focusable="false"></svg>
			</div>
			<div class="id-narrow" data-id-narrow aria-hidden="true"></div>
			<div class="mf-caption" data-mf-caption aria-hidden="true"></div>
		</div>
		<div class="mf-controls">
			<button class="mf-toggle" type="button" data-mf-toggle><span class="mf-icon" aria-hidden="true"></span><span data-mf-label>Play</span><span class="sr-only"> the invisible delegation figure</span></button>
			<button class="mf-btn" type="button" data-mf-replay><span class="mf-restart-icon" aria-hidden="true"></span><span class="id-restart-text">Restart</span></button>
			<input class="mf-scrub" type="range" data-mf-scrub aria-label="Scrub through the figure" value="0">
			<span class="mf-time" data-mf-time aria-hidden="true">0:00 / 1:39</span>
		</div>
		<p class="id-source" data-id-source hidden></p>
		<figcaption>
			<p class="sr-only" data-ed="page.srSummary"></p>
			<ol class="mf-beats is-list" data-mf-beats aria-label="Beats"></ol>
		</figcaption>
	</figure>
