<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invisible Delegation</title>
<meta name="description" data-ed-content="page.description" content="A teaching figure: ordinary requests for AI help can hand over the criteria, the argument and what 'strategic' means. Faculty find out by asking each student whose standard the help followed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../runtime/figures.css">
<style>
/* Whenever a picture label would render under 11 px (a stage narrower than
   880 px), the stage switches to a stacked text view driven by the same clock. */
.fig-quote a, .fig-follow a { color: var(--ink); text-underline-offset: 3px; }
.id-narrow { display: none; }
/* Collapsed, not display:none: the SVG keeps its width so it can still be measured. */
#invisible-delegation.is-stacked .mf-stage { height: 0; overflow: hidden; }
#invisible-delegation.is-stacked .id-narrow { display: block; padding: 3px clamp(10px, 3vw, 24px) 1px; background: var(--paper); }
@media (max-width: 480px) {
	/* The final frame, check and controls fit an 844 px phone screen: the caption band
	   is fixed at the final caption's height (name, definition and check), and the
	   controls stay on one row, with Restart shown as its icon. */
	#invisible-delegation .mf-controls { flex-wrap: nowrap; gap: 8px; }
	#invisible-delegation .mf-scrub { order: 0; flex: 1 1 0; flex-basis: 0; min-width: 0; }
	#invisible-delegation .mf-time { margin-left: 0; min-width: 0; font-size: 12px; }
	#invisible-delegation [data-mf-replay] { min-width: 44px; padding: 0 12px; justify-content: center; }
	#invisible-delegation .id-restart-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
	#invisible-delegation .mf-controls .mf-toggle { min-width: 92px; }
	#invisible-delegation .mf-check-q, #invisible-delegation .mf-follow.is-equal { font-size: 20px; }
	#invisible-delegation .mf-caption { min-height: 184px; padding-top: 10px; padding-bottom: 10px; }
}
.id-narrow p { margin: 0; }
.id-narrow [hidden] { display: none !important; }
.id-n-task { margin: 0 0 3px; padding: 5px 8px; border: 1px solid var(--navy-border); background: var(--paper-bright); font: 400 14px/1.35 var(--serif); color: var(--ink); }
.id-n-task b { margin-right: 4px; font: 600 12px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; }
.id-n-rubric span { font-style: italic; }
.id-n-rubric.is-lit { margin: 0 -4px; padding: 0 4px; background: rgba(10, 34, 66, 0.12); box-shadow: inset 3px 0 0 var(--ink); }
.id-n-rubric.is-consulted span { text-decoration: underline; text-decoration-color: rgba(10, 34, 66, 0.45); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.id-n-fac { margin: 0 0 2px !important; font: italic 400 16px/1.3 var(--serif); color: var(--ink); }
.id-n-fac b { margin-right: 6px; font: 600 12px/1.3 var(--mono); font-style: normal; letter-spacing: 0.05em; text-transform: uppercase; }
.id-n-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.id-n-col { min-width: 0; }
.id-n-who { display: flex; justify-content: space-between; gap: 6px; margin: 0 0 1px !important; font: 600 13px/1.2 var(--sans); color: var(--red); }
.id-n-who .id-n-draft { font: 600 12px/1.3 var(--mono); letter-spacing: 0.03em; text-transform: uppercase; }
.id-n-who > span:first-child::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--red); vertical-align: 1px; }
.id-n-paper { display: flex; flex-wrap: wrap; gap: 0 8px; margin: 0 0 3px !important; font: 600 12px/1.3 var(--mono); letter-spacing: 0.03em; text-transform: uppercase; }
.id-n-draft { color: var(--ink); }
.id-n-rev { color: var(--stone); }
.id-n-notes { position: relative; margin: 8px 0 4px; padding: 7px 6px 3px; background: rgba(222, 213, 196, 0.6); border: 1px solid rgba(91, 86, 79, 0.35); font: 400 13px/1.3 var(--serif); color: var(--stone); }
.id-n-notes b { position: absolute; top: -8px; left: 4px; padding: 0 3px; background: var(--paper); font: 600 12px/1.3 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.id-n-note i { display: inline-block; width: 1.1em; font-style: normal; color: var(--ink); }
.id-n-note.is-struck span { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.id-n-reason { padding-left: 1.1em; font-style: italic; color: var(--red); }
.id-n-keys { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 0 0 2px !important; font: 600 12px/1.35 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); }
.id-n-keys span { display: inline-flex; align-items: center; gap: 4px; }
.id-n-keys span::before { content: ""; width: 12px; height: 9px; border: 1.5px dashed rgba(10, 34, 66, 0.45); }
.id-n-keys .is-ai::before { border: 1.5px solid var(--stone); background: #ded5c4; }
.id-n-keys .is-own { color: var(--red); }
.id-n-keys .is-own::before { border: 1.5px solid var(--red); }
.id-n-keys .is-uns::before { border-color: var(--stone); }
.id-n-key { display: flex; align-items: center; gap: 5px; margin: 0 0 2px !important; font: 600 12px/1.3 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); }
.id-n-key::before { content: ""; flex: none; width: 13px; height: 9px; border: 1.5px dashed var(--stone); }
.id-n-cell { margin: 0 0 1px; }
.id-n-q { font: italic 400 14px/1.25 var(--serif); color: var(--ink); }
.id-n-q .is-red { color: var(--red); }
.id-n-uns { margin: 1px 0 0 !important; white-space: nowrap; font: 600 12px/1.45 var(--mono); letter-spacing: 0; text-transform: uppercase; color: var(--ink); }
.id-n-ghost { display: inline-block; margin-left: 2px; padding: 0 2px; border: 1.5px dashed var(--stone); font: italic 400 12px/1.3 var(--serif); letter-spacing: 0; text-transform: none; color: var(--stone); }
.id-n-chip { margin: 2px 0 0 !important; padding: 1px 6px 2px; border: 1.5px dashed rgba(10, 34, 66, 0.45); background: var(--paper-bright); font: 600 13px/1.25 var(--sans); color: var(--ink); }
.id-n-chip b { display: block; font: 600 12px/1.3 var(--mono); letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
.id-n-chip.is-ai { border: 1.5px solid var(--stone); background: #ded5c4; color: var(--stone); }
.id-n-chip.is-ai b { color: var(--stone); }
.id-n-chip.is-own { border: 1.5px solid var(--red); color: var(--red); }
.id-n-chip.is-own b { color: var(--red); }
.id-n-decided { display: block; font: italic 400 13px/1.25 var(--serif); color: var(--red); }
.id-n-chip.is-pulse { border-width: 3px; }
.id-n-say b { display: block; font: 600 12px/1.3 var(--sans); color: var(--red); }
.id-n-say { margin: 2px 0 0 !important; padding: 4px 7px; border: 1px solid rgba(10, 34, 66, 0.25); border-radius: 8px; background: var(--paper-bright); font: 400 13px/1.3 var(--serif); color: var(--ink); }
@media (min-width: 600px) {
	/* A wide stacked stage (a short laptop window) sets the evidence at 14–16 px. */
	#invisible-delegation .id-n-task, #invisible-delegation .id-n-notes, #invisible-delegation .id-n-q, #invisible-delegation .id-n-say { font-size: 15px; }
	#invisible-delegation .id-n-uns, #invisible-delegation .id-n-ghost, #invisible-delegation .id-n-chip { font-size: 14px; }
	#invisible-delegation .id-n-chip b, #invisible-delegation .id-n-notes b, #invisible-delegation .id-n-key, #invisible-delegation .id-n-paper, #invisible-delegation .id-n-who .id-n-draft { font-size: 13px; }
	#invisible-delegation .id-n-grid { gap: 20px; }
}
</style>
</head>
<body>
<header class="fig-top">
	<a class="brand" href="https://judgmentlab.net/">Judgment Lab<i>.</i></a>
	<nav aria-label="Judgment Lab"><a href="https://judgmentlab.net/#ii-what-the-problem-looks-like">Essay</a> · <a href="https://judgmentlab.net/#companion">Practice</a></nav>
</header>

<main class="fig-page">
	<p class="fig-kicker" data-ed="page.kicker"></p>
	<h1 data-ed="page.title"></h1>
	<p class="fig-setup" data-ed-rich="page.setup"></p>

	<figure class="mf" id="invisible-delegation" aria-labelledby="id-title">
		<p class="sr-only" id="id-title" data-ed="page.srTitle"></p>
		<div class="mf-shot" data-mf-shot>
			<div class="mf-stage">
				<svg viewBox="0 0 960 540" aria-hidden="true" focusable="false"></svg>
			</div>
			<div class="id-narrow" data-id-narrow aria-hidden="true"></div>
			<div class="mf-caption" data-mf-caption aria-hidden="true"></div>
		</div>
		<div class="mf-controls">
			<button class="mf-toggle" type="button" data-mf-toggle><span class="mf-icon" aria-hidden="true"></span><span data-mf-label>Play</span><span class="sr-only"> the invisible delegation figure</span></button>
			<button class="mf-btn" type="button" data-mf-replay><span class="mf-restart-icon" aria-hidden="true"></span><span class="id-restart-text">Restart</span></button>
			<input class="mf-scrub" type="range" data-mf-scrub aria-label="Scrub through the figure" value="0">
			<span class="mf-time" data-mf-time aria-hidden="true">0:00 / 1:33</span>
		</div>
		<figcaption>
			<p class="sr-only" data-ed="page.srSummary"></p>
			<ol class="mf-beats is-list" data-mf-beats aria-label="Beats"></ol>
		</figcaption>
	</figure>

	<section class="fig-section" aria-labelledby="id-check-h">
		<h2 id="id-check-h" data-ed="page.checkHeading"></h2>
		<div data-ed-lines="page.checkLines" data-ed-class="fig-check"></div>
		<p class="fig-follow" data-ed-rich="page.checkFollow"></p>
	</section>

	<section class="fig-section" aria-labelledby="id-essay-h">
		<h2 id="id-essay-h" data-ed="page.quoteHeading"></h2>
		<blockquote class="fig-quote">
			<p data-ed-rich="page.quotes.0.text"></p>
			<cite data-ed-rich="page.quotes.0.cite"></cite>
		</blockquote>
		<blockquote class="fig-quote" style="margin-top: 18px">
			<p data-ed-rich="page.quotes.1.text"></p>
			<cite data-ed-rich="page.quotes.1.cite"></cite>
		</blockquote>
	</section>

	<section class="fig-section" aria-labelledby="id-links-h">
		<h2 id="id-links-h" data-ed="page.linksHeading"></h2>
		<ul class="fig-links" data-ed-links="page.links"></ul>
	</section>
</main>

<script src="../../runtime/motion.js"></script>
<script src="invisible-delegation.js"></script>
</body>
</html>
