<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appropriate Reliance</title>
<meta name="description" data-ed-content="page.description" content="An interactive teaching figure: with time to check one of two tasks from the Dell'Acqua et al. field experiment, you decide where the check goes, see what the study found, and make one more call when a condition changes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../runtime/figures.css">
<style>
[hidden] { display: none !important; }
.fig-quote a, .fig-follow a { color: var(--ink); text-underline-offset: 3px; }

/* ---- a compact top, so the first question, the picture and Continue fit on screen */
.ar-page { padding-top: 16px; }
.ar-page h1 { margin-bottom: 4px; font-size: clamp(28px, 3vw, 38px); }
.ar-lede { margin: 0; font-size: 18px; line-height: 1.45; color: var(--body); }
.ar-page .mf { margin-top: 12px; }
/* The edition switch shares the kicker's row and its line box, so it adds no height: the
   first view still fits the live question. The note on what PME is sits under "How this
   figure works", and the PME link points to it (aria-describedby). */
.ar-toprow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; column-gap: 16px; }
.ar-toprow .fig-editions { margin: 0; font-size: 14px; line-height: 15.6px; }

/* ---- gates: hit targets over the drawn options, and Continue / Skip ---------- */
#appropriate-reliance .mf-shot { position: relative; }
.ar-capwrap { position: relative; }
.ar-gatebar { position: absolute; right: clamp(14px, 2.4vw, 28px); bottom: 12px; z-index: 3; display: flex; gap: 8px; align-items: center; }
.ar-prompt { font: 600 14px/1.2 var(--sans); color: var(--ink); }
.ar-continue, .ar-skip { min-height: 40px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 0; font: 600 15px/1 var(--sans); cursor: pointer; }
.ar-continue { background: var(--ink); color: var(--paper); }
.ar-continue:disabled { background: var(--paper); color: var(--stone-faint); border-color: var(--rail); cursor: not-allowed; }
.ar-skip { background: var(--paper); color: var(--ink); }
.ar-continue:focus-visible, .ar-skip:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.ar-hits { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.ar-hitset { position: absolute; inset: 0; margin: 0; padding: 0; border: 0; min-width: 0; }
.ar-hit { position: absolute; pointer-events: auto; cursor: pointer; border-radius: 18px; }
.ar-hit input { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; margin: 0; opacity: 0; }
.ar-hit:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 1px; }
@media (hover: hover) { .ar-hit:hover { background: rgba(10, 34, 66, 0.05); } }
/* Beat-list entries after an unanswered question are locked. */
.ar-locked { display: none; }
#appropriate-reliance .mf-beats li.is-locked .mf-text, #appropriate-reliance .mf-beats li.is-locked + .mf-detail, #appropriate-reliance .mf-beats li.is-locked .mf-detail { display: none; }
#appropriate-reliance .mf-beats li.is-locked .ar-locked { display: inline; font-style: italic; color: var(--stone-faint); }
#appropriate-reliance .mf-beats li.is-locked button { cursor: default; }

/* ---- the stacked stage --------------------------------------------------------
   Whenever a picture label would render under 11 px (the runtime's letterboxed scale),
   the stage switches to a stacked view driven by the same clock and calls. Within a
   phase every part is placed from the start and only fades in. Parts marked data-ph
   join only after a question (phase 2 after the first, 3 after the second), so the
   stage is compact while the reader decides and grows only when they continue. */
.ar-narrow { display: none; position: relative; }
#appropriate-reliance.is-stacked[data-phase="1"] [data-ph="2"], #appropriate-reliance.is-stacked[data-phase="1"] [data-ph="3"], #appropriate-reliance.is-stacked[data-phase="2"] [data-ph="3"] { display: none; }
#appropriate-reliance.is-stacked .mf-stage { height: 0; overflow: hidden; }
#appropriate-reliance.is-stacked .ar-narrow { display: block; padding: 8px clamp(10px, 3vw, 24px) 8px; background: var(--paper); }
#appropriate-reliance.is-stacked .mf-caption { overflow: hidden; }
/* On phones the stacked stage is taller than the screen, so the caption band and the
   controls stay at the bottom while it scrolls (the figure follows the action in play). */
@media (max-width: 719px) {
	#appropriate-reliance.is-stacked .ar-capwrap { position: sticky; bottom: var(--ar-ctrl-h, 120px); z-index: 4; box-shadow: 0 -1px 0 var(--navy-line); }
	#appropriate-reliance.is-stacked .mf-controls { position: sticky; bottom: 0; z-index: 5; }
}
/* The nameplate's card shows over the live first question; Continue and Skip wait with
   the caption band until it settles (any touch, key or focus settles it at once). */
#appropriate-reliance .ar-gatebar { transition: opacity 0.3s; }
#appropriate-reliance[data-mf-card] .ar-gatebar { opacity: 0; transition: none; }
/* The runtime clips the shot for the card; on phones clip without making the shot a
   scroll container, so the caption band and controls still stick to the screen. */
@media (max-width: 719px) { #appropriate-reliance.has-nameplate .mf-shot { overflow: visible; overflow: clip; } }
/* Caption band heights. The last caption sets the name and definition above the check,
   and this check is longer than the family's others, so the definition is 16 px and both
   check lines 20 px: then the definition and the check each take one line from 1024 px up
   and the last caption fits the runtime's 144 px band (109 px measured at 1440 and 1280,
   133 px at 1024); from 720 to 1023 px it takes two lines each, so the band is 156 px
   (153 px at 768) and --mf-plate grows by those 12 px. The band is fixed at desktop widths
   so the controls don't move at the last beat. On phones the band and controls stick to
   the bottom of the screen, so the band can grow at the last beat without moving the
   controls: 182 px for beats 1 to 9 (the second question and Continue at 360 px), 264 px
   for the last caption at 390 px. While the first question waits in the first view
   (.ar-firstq) the phone band holds only that question (124 px), so its options stay
   above it. */
#appropriate-reliance .mf-check-q, #appropriate-reliance .mf-follow.is-equal { font-size: 20px; }
#appropriate-reliance .mf-final-def { font-size: 16px; }
@media (min-width: 720px) { #appropriate-reliance .mf-caption { height: 144px; min-height: 0; } }
@media (min-width: 720px) and (max-width: 1023px) {
	#appropriate-reliance.has-nameplate { --mf-plate: 43px; }
	#appropriate-reliance .mf-caption { height: 156px; }
}
@media (max-width: 719px) {
	#appropriate-reliance.is-stacked .mf-caption { height: auto; min-height: 182px; overflow: visible; }
	#appropriate-reliance.is-stacked.ar-firstq .mf-caption { min-height: 124px; }
}
@media (max-width: 480px) {
	#appropriate-reliance.is-stacked .ar-narrow { padding: 6px 10px 6px; }
	.ar-n-task { font-size: 13.5px; line-height: 1.3; }
	.ar-n-card { padding: 5px 6px 6px; }
	.ar-n-opt { min-height: 32px; padding: 3px 7px; font-size: 13.5px; }
	.ar-n-src { margin-bottom: 4px; }
	.ar-n-band { margin: 5px 0 2px; }
	.ar-gatebar { bottom: 10px; }
	.ar-continue, .ar-skip { padding: 0 12px; font-size: 14px; }
}
.ar-n-src, .ar-n-flab, .ar-n-tag, .ar-n-pat, .ar-n-aihead, .ar-n-cond, .ar-n-note, .ar-n-evtitle, .ar-n-band, .ar-n-keys { font: 600 13px/1.3 var(--mono); letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); }
.ar-n-src { margin: 0 0 6px; }
.ar-n-grid { display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr); column-gap: 4px; }
.ar-n-gut { grid-column: 2; padding-top: 22px; }
.ar-n-col:first-child { grid-column: 1; }
.ar-n-col:last-child { grid-column: 3; }
.ar-n-gut svg { display: block; width: 100%; height: 100%; }
.ar-n-flab { margin: 0 0 4px; min-height: 2.6em; display: flex; align-items: flex-end; }
.ar-n-col:last-child .ar-n-flab { justify-content: flex-start; }
.ar-n-card { padding: 6px 7px 8px; border: 1px solid var(--navy-border); background: var(--paper-bright); }
.ar-n-tag { margin: 0; }
.ar-n-task { margin: 2px 0 4px; font: 400 14px/1.35 var(--serif); color: var(--ink); }
.ar-n-mark.is-under { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
.ar-n-pat { margin: 0 0 6px; }
.ar-n-pat.is-reasoning { font: italic 400 14px/1.35 var(--serif); letter-spacing: 0; text-transform: none; }
.ar-n-plabel { display: block; font: 500 13px/1.3 var(--mono); font-style: normal; letter-spacing: 0.01em; text-transform: uppercase; }
.ar-n-ai { margin: 0 0 6px; }
.ar-n-aihead { margin: 0 0 3px; display: flex; justify-content: space-between; align-items: center; gap: 4px; color: var(--stone); }
.ar-n-ready { padding: 0 6px; border-radius: 8px; background: var(--stone); color: var(--paper-bright); }
.ar-n-lines { padding: 4px 6px 5px; background: #ded5c4; border-radius: 2px; }
.ar-n-line { display: block; height: 4px; margin: 2px 0; border-radius: 2px; background: var(--stone); opacity: 0.8; transform-origin: 0 50%; }
.ar-n-line.is-short { width: 60%; }
.ar-n-cond { margin: 6px 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 2px 6px; flex-wrap: wrap; }
.ar-n-yc { font: 600 13px/1.3 var(--sans); letter-spacing: 0; text-transform: none; color: var(--red); }
.ar-n-yc.is-skipped { color: var(--muted); }
.ar-n-opt { display: flex; align-items: center; gap: 7px; min-height: 34px; margin: 0 0 4px; padding: 4px 9px; border: 1.1px solid rgba(10, 34, 66, 0.55); border-radius: 19px; background: var(--paper-bright); font: 600 14px/1.2 var(--sans); color: var(--ink); }
.ar-n-opt.is-chosen { border: 1.8px solid var(--ink); }
.ar-n-radio { flex: none; display: grid; place-items: center; width: 14px; height: 14px; border: 1.1px solid var(--ink); border-radius: 50%; }
.ar-n-opt.is-chosen .ar-n-radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
.ar-n-opt.is-moved .ar-n-radio::after { content: ""; width: 6px; height: 6px; border: 1.6px solid var(--red); border-radius: 50%; }
.ar-n-rely { margin: 0 0 4px; min-height: 1.3em; font: 600 13px/1.3 var(--sans); color: var(--red); }
.ar-n-sugp { margin: 2px 0 3px; }
.ar-n-sug { padding: 1px 5px; background: var(--ink); color: var(--paper-bright); font: 600 13px/1.65 var(--mono); letter-spacing: 0.01em; text-transform: uppercase; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.ar-n-note { margin: 0 0 6px; }
.ar-n-ev { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--navy-line); }
.ar-n-evtitle { margin: 0 0 4px; }
.ar-n-num { margin: 0; font: 400 14px/1.35 var(--sans); color: var(--ink); }
.ar-n-num b { font: 600 15px/1.3 var(--serif); }
.ar-n-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 6px; align-items: center; margin: 0 0 3px; }
.ar-n-barl { grid-column: 1 / -1; font: 400 13px/1.3 var(--sans); color: var(--ink); }
.ar-n-barl:empty { display: none; }
.ar-n-bart { height: 10px; background: rgba(10, 34, 66, 0.06); }
.ar-n-bart i { display: block; height: 100%; background: var(--ink); opacity: 0.85; transform-origin: 0 50%; }
.ar-n-bar b { font: 600 13px/1.3 var(--sans); color: var(--ink); }
.ar-n-evq { margin: 4px 0 0; font: italic 400 14px/1.35 var(--serif); color: var(--ink); }
.ar-n-band { margin: 8px 0 4px; }
.ar-n-keys { display: flex; justify-content: space-between; gap: 8px; }
.ar-n-keyyou { color: var(--red); }
.ar-n-keyyou::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: var(--red); vertical-align: -1px; }
.ar-n-keysug::before { content: ""; display: inline-block; width: 14px; height: 10px; margin-right: 6px; border-radius: 2px; background: var(--ink); vertical-align: -1px; }
.ar-n-panel { position: absolute; left: clamp(10px, 3vw, 24px); right: clamp(10px, 3vw, 24px); top: 28%; padding: 12px 14px; border: 1px solid var(--navy-border); background: var(--paper-bright); box-shadow: 3px 4px 0 rgba(10, 34, 66, 0.06); visibility: hidden; }
.ar-n-panel .ar-n-bart { height: 14px; }
.ar-n-panel .ar-n-barl, .ar-n-panel .ar-n-bar b { font-size: 15px; }
.ar-n-panel .ar-n-evq { font-size: 16px; }

/* ---- the page: spoilers sit behind a disclosure until the figure reaches its check */
.ar-after { max-width: 72ch; margin: 0 0 36px; border-top: 1px solid var(--faint); }
.ar-after-locked { max-width: 72ch; margin: 0 0 36px; padding: 14px 0 0; border-top: 1px solid var(--faint); font: 600 12px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone-faint); }
.ar-after > summary { padding: 14px 0 6px; cursor: pointer; font: 600 12px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ar-after > summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.ar-after h3 { margin: 18px 0 8px; font: 600 12px/1.3 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ar-printq { display: none; }
@media print {
	.ar-printq { display: block; break-after: page; }
	.ar-printq-plate { margin: 0 0 10px; font: 600 12px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
	#appropriate-reliance .mf-namecard, #appropriate-reliance .mf-namescrim { display: none !important; }
	.ar-printq svg { display: block; width: 100%; height: auto; }
	.ar-printq-cap { margin: 10px 0 0; font: 400 20px/1.35 var(--serif); color: var(--ink); }
	#appropriate-reliance.is-stacked .mf-stage { height: auto; overflow: visible; }
	#appropriate-reliance .ar-narrow, .ar-hits, .ar-gatebar, .ar-showall { display: none !important; }
	.ar-after > summary, .ar-after-locked { display: none; }
	.ar-after { display: block !important; }
}
</style>
</head>
<body>
<header class="fig-top">
	<a class="brand" href="https://judgmentlab.net/">Judgment Lab<i>.</i></a>
	<nav aria-label="Judgment Lab"><a href="https://judgmentlab.net/#v-appropriate-reliance-as-a-teachable-competency">Essay</a> · <a href="https://judgmentlab.net/#companion">Practice</a></nav>
</header>

<main class="fig-page ar-page">
	<div class="ar-toprow">
		<p class="fig-kicker" data-ed="page.kicker"></p>
		<nav class="fig-editions" aria-label="Choose an example">See this with: <a data-edition-link="business">Workplace</a> · <a data-edition-link="pme" aria-describedby="ar-edition-note">PME</a></nav>
	</div>
	<h1 data-ed="page.title"></h1>
	<p class="ar-lede" data-ed-rich="page.setup"></p>

	<div class="ar-printq" data-ar-printq aria-hidden="true">
		<p class="ar-printq-plate" data-ar-plate></p>
		<p class="fig-kicker" data-ed="page.printKicker"></p>
		<div data-ar-printq-svg></div>
		<p class="ar-printq-cap" data-ed="page.printCaption"></p>
	</div>

	<figure class="mf" id="appropriate-reliance" aria-labelledby="ar-title">
		<p class="sr-only" id="ar-title" data-ed="page.srTitle"></p>
		<div class="mf-shot" data-mf-shot>
			<div class="mf-stage">
				<svg viewBox="0 0 960 540" aria-hidden="true" focusable="false"></svg>
			</div>
			<div class="ar-narrow" data-ar-narrow aria-hidden="true"></div>
			<div class="ar-hits">
				<fieldset class="ar-hitset" data-ar-gate="0" hidden>
					<legend class="sr-only" data-ed="gates.legends.0"></legend>
					<label class="ar-hit" data-ar-opt="a"><input type="radio" name="ar-g1" value="a"><span class="sr-only" data-ed="gates.options.a"></span></label>
					<label class="ar-hit" data-ar-opt="b"><input type="radio" name="ar-g1" value="b"><span class="sr-only" data-ed="gates.options.b"></span></label>
				</fieldset>
				<fieldset class="ar-hitset" data-ar-gate="1" hidden>
					<legend class="sr-only" data-ed="gates.legends.1"></legend>
					<label class="ar-hit" data-ar-opt="rely"><input type="radio" name="ar-g2" value="rely"><span class="sr-only" data-ed="gates.options.rely"></span></label>
					<label class="ar-hit" data-ar-opt="move"><input type="radio" name="ar-g2" value="move"><span class="sr-only" data-ar-movelabel></span></label>
					<label class="ar-hit" data-ar-opt="time"><input type="radio" name="ar-g2" value="time"><span class="sr-only" data-ed="gates.options.time"></span></label>
				</fieldset>
			</div>
			<div class="ar-capwrap">
				<div class="mf-caption" data-mf-caption aria-hidden="true"></div>
				<div class="ar-gatebar" data-ar-gatebar hidden>
					<span class="ar-prompt" data-ar-prompt hidden data-ed="gates.prompt"></span>
					<button class="ar-continue" type="button" data-ar-continue disabled data-ed="gates.continue"></button>
					<button class="ar-skip" type="button" data-ar-skip data-ed="gates.skip"></button>
				</div>
			</div>
		</div>
		<div class="mf-controls">
			<button class="mf-toggle" type="button" data-mf-toggle><span class="mf-icon" aria-hidden="true"></span><span data-mf-label>Play</span><span class="sr-only"> the appropriate reliance figure</span></button>
			<button class="mf-btn" type="button" data-mf-replay><span class="mf-restart-icon" aria-hidden="true"></span>Start over</button>
			<input class="mf-scrub" type="range" data-mf-scrub aria-label="Scrub through the figure" value="0">
			<span class="mf-time" data-mf-time aria-hidden="true">0:28 / 2:00</span>
		</div>
		<p class="sr-only" aria-live="polite" data-ar-live></p>
		<figcaption>
			<p class="sr-only" data-ar-sum1 data-ed="page.srSummary.0"></p>
			<p class="sr-only" data-ar-sum2 hidden data-ed="page.srSummary.1"></p>
			<p class="sr-only" data-ar-sum3 hidden data-ed="page.srSummary.2"></p>
			<ol class="mf-beats is-list" data-mf-beats aria-label="Beats"></ol>
		</figcaption>
	</figure>

	<section class="fig-section" aria-labelledby="ar-check-h">
		<h2 id="ar-check-h" data-ed="page.checkHeading"></h2>
		<p class="fig-check" data-ed="page.checkLines.0"></p>
		<p class="fig-check" data-ed="page.checkLines.1"></p>
	</section>

	<section class="fig-section" aria-labelledby="ar-how-h">
		<h2 id="ar-how-h" data-ed="page.howHeading"></h2>
		<p class="fig-follow" data-ed-rich="page.how"></p>
		<p class="fig-edition-note" id="ar-edition-note">PME (professional military education): the example from <em>The Irreducible Officer</em>, the National War College essay.</p>
	</section>

	<p class="ar-after-locked" data-ar-after-locked data-ed="page.afterLocked"></p>
	<details class="ar-after" id="ar-after" hidden>
		<summary data-ed="page.afterSummary"></summary>
		<h3 data-ed="page.after.0.heading"></h3>
		<p class="fig-follow" data-ar-ed-rich="page.after.0.text"></p>
		<h3 data-ed="page.after.1.heading"></h3>
		<p class="fig-follow" data-ar-ed-rich="page.after.1.text"></p>
		<h3 data-ed="page.after.2.heading"></h3>
		<p class="fig-follow" data-ar-ed-rich="page.after.2.text"></p>
	</details>

	<section class="fig-section" aria-labelledby="ar-essay-h" data-ed-section="page.quotes">
		<h2 id="ar-essay-h" data-ed="page.quoteHeading"></h2>
		<blockquote class="fig-quote">
			<p data-ar-ed-rich="page.quotes.0.text"></p>
			<cite data-ed-rich="page.quotes.0.cite"></cite>
		</blockquote>
		<blockquote class="fig-quote" style="margin-top: 18px">
			<p data-ar-ed-rich="page.quotes.1.text"></p>
			<cite data-ed-rich="page.quotes.1.cite"></cite>
		</blockquote>
	</section>

	<section class="fig-section" aria-labelledby="ar-links-h">
		<h2 id="ar-links-h" data-ed="page.linksHeading"></h2>
		<p class="fig-follow" data-ed-rich="page.linksNote" data-ed-section="page.linksNote" hidden></p>
		<ul class="fig-links" data-ed-links="page.links"></ul>
	</section>
</main>

<script src="../../runtime/motion.js"></script>
<script src="appropriate-reliance.js"></script>
</body>
</html>
