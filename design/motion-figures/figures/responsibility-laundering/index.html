<style>
/* Whenever a picture label would render under 11 px (the runtime's letterboxed
   scale), the stage switches to a stacked text view driven by the same clock. Its
   layout is fixed from the first frame (sections only fade in), and the caption band
   has a fixed height, so the controls never move. */
.rl-narrow { display: none; position: relative; }
/* Collapsed, not display:none: the SVG keeps its box so it can still be measured. */
#responsibility-laundering.is-stacked .mf-stage { height: 0; overflow: hidden; }
#responsibility-laundering.is-stacked .rl-narrow { display: block; padding: 6px clamp(12px, 3vw, 24px) 4px; background: var(--paper); }
#responsibility-laundering.is-stacked .mf-caption { height: 136px; overflow: hidden; }
@media (max-width: 719px) { #responsibility-laundering.is-stacked .mf-caption { height: 194px; } #responsibility-laundering.is-stacked .mf-caption.is-check { padding-top: 10px; padding-bottom: 10px; } }
/* The final caption (name and definition over the check) must stay inside the runtime's
   144 px desktop band, or the viewport fit at 1280 x 720 would drop to the stacked stage.
   The long name wraps in its label column, and the check is set a little smaller. */
@media (min-width: 720px) {
	#responsibility-laundering .mf-check.has-final { grid-template-columns: min-content minmax(0, 1fr); }
	/* A check label longer than the name's longest word ("REVIEWER'S CHECK") stays on one line. */
	#responsibility-laundering .mf-check.has-final > .mf-check-label { white-space: nowrap; }
	#responsibility-laundering .mf-check-q, #responsibility-laundering .mf-follow.is-equal { font-size: clamp(22px, 2.4vw, 27px); }
	#responsibility-laundering.is-stacked .mf-caption { height: 188px; }
}
/* The opening name card is one line (the runtime sets it nowrap); this name is long, so on
   phones it scales with the width to keep about 16 px clear on each side. */
@media (max-width: 559px) { #responsibility-laundering .mf-namecard-n { font-size: clamp(22px, calc((100vw - 70px) / 11.3), 34px); } }
@media (max-width: 480px) {
	#responsibility-laundering .mf-check-q, #responsibility-laundering .mf-follow.is-equal { font-size: 18px; }
	#responsibility-laundering .mf-final-def { font-size: 15px; }
}
