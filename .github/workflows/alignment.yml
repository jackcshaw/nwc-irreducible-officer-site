name: alignment
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      caller_repo: { type: string, required: true }
      caller_ref: { type: string, required: true }

permissions:
  contents: read

concurrency:
  group: alignment-${{ github.workflow }}-${{ inputs.caller_repo || github.repository }}-${{ inputs.caller_ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CALLER_REPO: ${{ inputs.caller_repo || 'nwc-irreducible-officer-site' }}
      CALLER_REF: ${{ inputs.caller_ref || github.head_ref || github.ref_name }}
      COMPANION_REPO_PATH: ../nwc-irreducible-officer-companion
      WORKBENCH_REPO_PATH: ../nwc-faculty-workbench
    steps:
      - name: Choose a ref for each repository
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CALLER_REF is passed via env and always quoted; it is never interpolated into this script.
          echo "| repository | ref |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for repo in nwc-irreducible-officer-companion nwc-faculty-workbench nwc-irreducible-officer-site; do
            ref=main
            if [ "$repo" = "$CALLER_REPO" ]; then
              ref="$CALLER_REF"
            else
              # Match the full ref so "foo" cannot tail-match "codex/foo". Exit 2 means absent.
              status=0
              git ls-remote --exit-code --heads "https://github.com/jackcshaw/$repo" "refs/heads/$CALLER_REF" >/dev/null || status=$?
              if [ "$status" -eq 0 ]; then
                # Use a sibling's same-named branch only when it carries commits main lacks.
                ahead=$(gh api "repos/jackcshaw/$repo/compare/main...$(jq -rn --arg r "$CALLER_REF" '$r|@uri')" -q .ahead_by) || { echo "::error::Could not compare $repo main...$CALLER_REF (GitHub API error); rerun the job"; exit 1; }
                if [ "$ahead" -gt 0 ]; then ref="$CALLER_REF"; fi
              elif [ "$status" -ne 2 ]; then
                echo "::error::git ls-remote for $repo failed with exit $status"
                exit 1
              fi
            fi
            key="${repo##*-}"
            echo "$key=$ref" >> "$GITHUB_OUTPUT"
            echo "| $repo | $ref |" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/checkout@v4
        with: { repository: jackcshaw/nwc-irreducible-officer-companion, ref: "${{ steps.refs.outputs.companion }}", path: nwc-irreducible-officer-companion, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: jackcshaw/nwc-faculty-workbench, ref: "${{ steps.refs.outputs.workbench }}", path: nwc-faculty-workbench, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: jackcshaw/nwc-irreducible-officer-site, ref: "${{ steps.refs.outputs.site }}", path: nwc-irreducible-officer-site, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: nwc-irreducible-officer-site/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: nwc-irreducible-officer-site
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build
        working-directory: nwc-irreducible-officer-site
        run: npm run build
      - name: Contract and alignment tests
        working-directory: nwc-irreducible-officer-site
        run: npm test
      - name: Browser checks
        working-directory: nwc-irreducible-officer-site
        run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alignment-failure
          path: |
            nwc-irreducible-officer-site/dist
            nwc-irreducible-officer-site/playwright-report
          retention-days: 7
